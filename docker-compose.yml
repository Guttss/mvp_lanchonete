version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: lanchonete-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminlanchemaisdb
      POSTGRES_DB: lanchonetedb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: